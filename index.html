function splitPane(l) {

function parseQ(text) {
  const L0 = text.split("\n");
  let tab = -1;
  for (let i = L0.length - 1; i >= 0; i--) if (/^\s*←.*→\s*$/.test(L0[i])) {
    tab = i;
    break;
  }
  let first = L0.findIndex(((l, i) => i >= Math.max(tab, 0) && /^\s*(❯)?\s*\d{1,2}\.\s/.test(l)));
  const pane = first >= 0 && L0.slice(first).some((l => /\S\s{2,}[┌╭]|^\s*[┌╭]/.test(l)));
  const preview = [];
  const L = pane ? L0.map(((l, i) => {
    if (i < first) return l;
    const [left, right] = splitPane(l);
    const t = right.replace(/[┌┐└┘├┤│─╭╮╰╯]/g, "").trim();
    if (t) preview.push(t);
    return left;
  })) : L0;
  const opts = [];
  let cur = null, next = false;
  for (const l of L.slice(Math.max(tab, 0))) {
    const m = l.match(/^\s*(❯)?\s*(\d{1,2})\.\s+(.*\S)\s*$/);
    if (m) {
      let lab = m[3];
      const box = /^\[[ ✔]\]/.test(lab);
      opts.push({
        n: +m[2],
        box: box,
        on: /^\[✔\]/.test(lab),
        label: lab.replace(/^\[[ ✔]\]\s*/, "")
      });
      if (m[1]) cur = +m[2];
      continue;
    }
    const nx = l.match(/^\s*(❯)?\s*(Next|Submit|Review)\s*$/);
    if (nx) {
      next = nx[2];
      if (nx[1]) cur = "next";
    }
  }
  if (!opts.length) {
    const i = L.findIndex((l => /^\s*❯\s+\S/.test(l)));
    if (i >= 0) {
      const ind = L[i].match(/^(\s*)❯/)[1].length;
      const row = new RegExp("^\\s{" + ind + "}(❯|\\s)\\s+\\S");
      const inMenu = l => row.test(l) && !/Enter to confirm|Esc to cancel/.test(l);
      let a = i, b = i;
      while (a > 0 && inMenu(L[a - 1])) a--;
      while (b < L.length - 1 && inMenu(L[b + 1])) b++;
      L.slice(a, b + 1).forEach(((l, k) => {
        opts.push({
          n: k + 1,
          box: false,
          on: false,
          plain: true,
          label: l.replace(/^\s*❯?\s*/, "").trim()
        });
        if (/^\s*❯/.test(l)) cur = k + 1;
      }));
    }
  }
  const multi = opts.some((o => o.box));
  const boxes = opts.filter((o => o.box));
  const textRow = multi ? boxes.length ? boxes[boxes.length - 1].n : null : (opts.find((o => /^Type something\.?$/.test(o.label))) || {}).n || null;
  return {
    tab: tab,
    opts: opts.filter((o => o.label !== "Chat about this")),
    cur: cur,
    multi: multi,
    next: next,
    textRow: textRow,
    lines: L,
    pane: pane,
    preview: preview
  };
}

    ref: ref,
    n: n || 1,
    host: host || a.host,
    agent: a

  if (sameAgent(ownerRow(h, A), a)) {

      const w = projWaits(p);

function parseHash(h) {
  const o = {};
  for (const kv of String(h || "").replace(/^#/, "").split("&")) {
    if (!kv) continue;
    const i = kv.indexOf("=");
    const k = i < 0 ? kv : kv.slice(0, i);
    let v = i < 0 ? "1" : kv.slice(i + 1);
    try {
      v = decodeURIComponent(v);
    } catch (e) {}
    o[k] = v;
  }
  return o;
}

function prdThreads(p, comments) {
  const cs = (comments || []).filter((c => c.job === p.id && c.host === p.host)).sort(byField("ts", 1));
  const paras = (p.paragraphs || []).map((x => Object.assign({}, x, {
    comments: []
  })));
  const by = new Map(paras.map((x => [ x.sha, x ])));
  const general = [], gone = [];
  for (const c of cs) {
    const o = {
      c: c,
      old: commentOld(c, p.sha256)
    };
    if (c.para) {
      const t = by.get(c.para.sha);
      if (t) t.comments.push(o); else gone.push(o);
    } else general.push(o);
  }
  return {

    general: general,
    gone: gone
  };
}

function sideGroups(agents, tree, cards, prds) {
  const live = (agents || []).filter((a => a && a.kind !== "peer_error"));
  const hqs = new Set;
  for (const a of live) if (a.owner) hqs.add(a.owner);
  for (const x of tree && tree.projects || []) if (x.p.owner) hqs.add(x.p.owner);
  for (const p of prds || []) if (p && p.owner) hqs.add(p.owner);
  const groups = [ ...hqs ].sort().map((h => {
    const self = live.find((a => !a.owner && agentHq(a) === h)) || null;
    const workers = live.filter((a => a.owner === h)).sort(byName);
    return {
      hq: h,
      agent: self,
      workers: workers
    };
  }));
  return {
    groups: groups,
    loose: live.filter((a => !a.owner && !hqs.has(agentHq(a)))).sort(byName)
  };
}

function fmtBytes(n, base) {

  n = +n || 0;

  while (n >= b && i < u.length - 1) {
    n /= b;
    i++;
  }
  return (i ? +n.toFixed(n < 10 ? 1 : 0) : Math.round(n)) + " " + u[i];
}

const SCHED_WHY = {
  late: [ N_("沒有接手"), "stuck" ],

  sent: [ N_("已送出"), "wait" ],

  running: [ N_("在跑"), "run" ],
  scheduled: [ N_("排定"), "wait" ],
  done: [ N_("結束"), "ok" ]
};

const SCHED_RANK = {
  late: 0,
  failed: 0,
  queued: 1,
  sent: 1,
  taken: 2,
  running: 3,
  scheduled: 4,
  done: 5
};

function schedCards(L, a, jobs, now) {
  const R = reqSections(L || [], a, now), J = jobSections(jobs || []), out = [];
  const failed = j => j.ok === false && !j.stopped_by_user;
  for (const r of R.sent) out.push({
    kind: "req",
    why: now - tms(r.sent_at) > 18e4 ? "late" : "sent",
    r: r
  });
  for (const j of J.done.filter(failed)) out.push({
    kind: "job",
    why: "failed",
    j: j
  });
  for (const r of R.queued) out.push({
    kind: "req",
    why: "queued",
    r: r,
    queued: R.queued
  });
  for (const r of R.taken) out.push({
    kind: "req",
    why: "taken",
    r: r
  });
  for (const j of J.running) out.push({
    kind: "job",
    why: "running",
    j: j
  });
  for (const j of J.scheduled) out.push({
    kind: "job",
    why: "scheduled",
    j: j
  });
  for (const j of J.done.filter((j => !failed(j)))) out.push({
    kind: "job",
    why: "done",
    j: j
  });
  for (const r of R.done) out.push({
    kind: "req",
    why: "done",
    r: r
  });
  return out.map(((c, i) => ({
    ...c,
    i: i,
    rank: SCHED_RANK[c.why]
  }))).sort(((x, y) => x.rank - y.rank || x.i - y.i));
}

function okrParse(s) {
  const L = String(s || "").replace(/\r/g, "").split("\n");
  let title = "";
  const intro = [];
  const cards = [];
  let c = null;
  for (const l of L) {
    if (!c && !title && /^#\s+\S/.test(l)) {
      title = l.replace(/^#\s+/, "").trim();
      continue;
    }
    if (/^##\s+\S/.test(l)) {
      const h = l.replace(/^##\s+/, "").trim();
      const m = /^(O\d{1,2})[\s　:：.、-]+(.*)$/.exec(h);
      c = {
        head: h,
        id: m ? m[1] : "",
        name: m ? m[2].trim() : h,
        retired: /^停用|^retired/i.test(h),
        desc: [],
        krs: [],
        note: []
      };
      cards.push(c);
      continue;
    }
    if (!c) {
      intro.push(l);
      continue;
    }
    const li = /^\s{0,3}[-*+]\s+(.*)$/.exec(l);
    if (li && !c.note.some((x => x.trim()))) {
      const g = /^\[([^\]]{1,12})\]\s*(.*)$/.exec(li[1]);
      c.krs.push(g ? {
        tag: g[1],
        text: g[2]
      } : {
        tag: "",
        text: li[1]
      });
      continue;
    }
    if (/^\s+\S/.test(l) && c.krs.length && !c.note.some((x => x.trim()))) {
      c.krs[c.krs.length - 1].text += " " + l.trim();
      continue;
    }
    (c.krs.length ? c.note : c.desc).push(l);
  }
  if (!cards.length) return null;
  const txt = a => a.join("\n").trim();
  const last = cards[cards.length - 1];
  const rest = txt(last.note);
  last.note = [];
  return {
    title: title,
    intro: txt(intro),
    cards: cards.map((x => ({
      head: x.head,
      id: x.id,
      name: x.name,
      retired: x.retired,
      desc: txt(x.desc),
      krs: x.krs,
      note: txt(x.note)
    }))),
    rest: rest
  };
}

function alertItems(L) {

    if (seen.has(k)) continue;
    seen.add(k);
    out.push(x);
  }
  return out.sort(((a, b) => (a.level === "over" ? 0 : 1) - (b.level === "over" ? 0 : 1)));
}

const OUT_KEY = "aide.outbox";

const OUT_MAX = 50;

const OUT_TTL = 864e5;

function outLoad(store, now) {
  let L = [];
  try {
    L = JSON.parse(store.getItem(OUT_KEY) || "[]");
  } catch (e) {}
  return outExpire((Array.isArray(L) ? L : []).filter((o => o && o.id && o.k && typeof o.t === "string" && now - (o.at || 0) < OUT_TTL)).map((o => o.st === "sending" ? {
    ...o,
    st: "unsure"
  } : o)), now);
}

function outExpire(L, now) {
  return (L || []).filter((o => !(o.st === "sent" && now - (o.at || 0) > 18e5)));
}

function outSave(store, L) {

}

const outMark = (L, id, st) => L.map((o => o.id === id ? {
  ...o,
  st: st
} : o));

const outDrop = (L, id) => L.filter((o => o.id !== id));

const outFor = (L, k) => L.filter((o => o.k === k));

const OUT_SENT_TTL = 18e5;

const outNorm = s => String(s || "").replace(/^\s*\[aide:q\d+\]\s*/, "").replace(/\s+/g, "").slice(0, 120);

function outSettle(L, k, messages, now) {
  const seen = (messages || []).filter((m => m && m.role === "user")).map((m => outNorm(m.text))).filter(Boolean);
  return L.filter((o => {
    if (o.k !== k) return true;
    if (now && o.st === "sent" && now - (o.at || 0) > OUT_SENT_TTL) return false;
    const t = outNorm(o.t);
    if (!t) return false;
    const i = seen.findIndex((x => x === t || x.length >= 20 && t.startsWith(x) || t.length >= 20 && x.startsWith(t)));
    if (i < 0) return true;
    seen.splice(i, 1);
    return false;
  }));
}

const outBusy = L => L.some((o => o.st === "sending"));

  taken: N_("agent 已經收到；它做完手上這一步就會處理"),
  unsure: N_("頁面在送出途中重新載入，不確定有沒有送到")
};

function outShown(o, queue, a) {
  if (!o || o.st !== "sent") return o ? o.st : "";
  const t = outNorm(o.t);
  if (!t || !a) return o.st;
  const hit = (queue || []).some((r => r && r.agent && r.agent.host === a.host && r.agent.pane_id === a.pane_id && (r.state === "taken" || r.state === "done") && (!o.at || !r.created || tms(r.created) >= o.at - 1e4) && (() => {
    const x = outNorm(r.text);
    return x && (x === t || x.length >= 20 && t.startsWith(x) || t.length >= 20 && x.startsWith(t));
  })()));
  return hit ? "taken" : "sent";
}

const OUT_STUCK_MS = 12e4;

const outSameTime = (o, r) => !o.at || !r.created || tms(r.created) >= o.at - 1e4;

function outQueueItem(o, queue, a) {
  const t = outNorm(o && o.t);
  if (!t || !a) return null;
  return (queue || []).find((r => r && r.agent && r.agent.host === a.host && r.agent.pane_id === a.pane_id && outSameTime(o, r) && (() => {
    const x = outNorm(r.text);
    return x && (x === t || x.length >= 20 && t.startsWith(x) || t.length >= 20 && x.startsWith(t));
  })())) || null;
}

function outStuck(L, k, queue, a, now) {
  return outFor(L, k).filter((o => {
    if (o.st === "sending" || o.st === "unsure") return false;
    const r = outQueueItem(o, queue, a);
    if (!r) return false;
    const end = r.done_at || r.turn_ended_at;
    return !!end && now - tms(end) > OUT_STUCK_MS;
  }));
}

function outSpanCovers(msgs, o, queue, a) {
  const r = outQueueItem(o, queue, a);
  if (!r || !Array.isArray(msgs)) return false;
  const t0 = tms(r.taken_at || r.sent_at || r.created);
  if (!t0) return false;
  let old = Infinity;
  for (const m of msgs) {
    const t = m && m.ts ? tms(m.ts) : 0;
    if (t && t < old) old = t;
  }
  return old <= t0;
}

const I18N_STATIC = [];

function trText(v) {
  const m = /^([^㐀-鿿A-Za-z0-9]*)([\s\S]*?)(\s*)$/.exec(v);
  return m[1] + tr(m[2]) + m[3];
}

function trStatic() {
  for (const [n, a, zh] of I18N_STATIC) {
    const v = trText(zh);
    if (a) n.setAttribute(a, v); else if (n.nodeValue !== v) n.nodeValue = v;
  }
  document.documentElement.lang = LANG === "en" ? "en" : "zh-Hant";
}

(() => {
  const w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n = w.nextNode(); n; n = w.nextNode()) if (!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName) && /[㐀-鿿]/.test(n.nodeValue)) I18N_STATIC.push([ n, null, n.nodeValue ]);
  for (const e of document.body.querySelectorAll("[placeholder],[title],[aria-label]")) for (const a of [ "placeholder", "title", "aria-label" ]) {
    const v = e.getAttribute(a);
    if (v && /[㐀-鿿]/.test(v)) I18N_STATIC.push([ e, a, v ]);
  }
})();

}), {

document.addEventListener("touchmove", (e => {
  if (from === null || drag) return;
  const t = e.touches[0], dx = t.clientX - tx, dy = Math.abs(t.clientY - ty);

async function tfetch(u, o, ms) {
  const c = new AbortController;
  const t = setTimeout((() => c.abort()), ms || o && o.waitMs || 5e3);
  try {
    return await fetch(u, Object.assign({}, o, {
      signal: c.signal
    }));
  } finally {
    clearTimeout(t);
  }
}

async function raw(u, o) {
  o = Object.assign({
    credentials: "include"
  }, o || {});
  if (API === "") {
    const idem = !o.method || /^(GET|HEAD)$/i.test(o.method);
    const at = async base => {
      try {
        const r = await tfetch(base + u, o);
        if (r.status < 502 || r.status > 504) return r;
      } catch (e) {
        if (!idem && e && e.name === "AbortError") throw new Error(trf("等了 {n} 秒沒有回應，可能已經送到了；先看一下再決定要不要重送", {
          n: Math.round((o.waitMs || 5e3) / 1e3)
        }));
      }
      return null;
    };
    const x = await reach((() => at("")), fallbacks(ALT, homeName(), location.origin), (b => at(b.url)), (() => new Promise((res => setTimeout(res, HOME_RETRY_MS)))));
    const r = x.r;
    if (r && !x.via) {
      S.homeDown = false;
      if (buildChanged(BUILD, r.headers.get("x-aide-build"), API)) newBuild(r.headers.get("x-aide-build"));
      return r;
    }
    if (r) {
      API = x.via.url;
      S.homeDown = true;
      showVia();
      return r;
    }
    S.homeDown = true;
    renderSide();
    throw new Error(unreachableMsg(homeName(), (S.cfg && S.cfg.peers || []).map((p => p.host))));
  }
  return tfetch(API + u, o);
}

const apiHost = () => (ALT.find((b => b.url === API)) || {}).host;

async function j(u, o) {
  const r = await raw(u, o);
  if (r.status === 401) {
    if (!API) {
      location.reload();
      throw 0;
    }
    throw new Error(notPairedMsg(apiHost()));
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

function newBuild(b) {
  let tried = "";

  try {

  } catch (e) {}
  const up = navigator.serviceWorker && navigator.serviceWorker.getRegistration ? navigator.serviceWorker.getRegistration().then((r => r && r.update())).catch((() => {})) : Promise.resolve();
  up.finally((() => location.reload()));
}

async function pairWith(p) {
  try {
    const t = await j("/api/backup/pair", {
      method: "POST",
      headers: H,
      body: JSON.stringify({
        host: p.host
      })
    });
    const r = await tfetch(t.url + "/pair", {
      method: "POST",
      credentials: "include",
      headers: H,
      body: JSON.stringify({
        token: t.token
      })
    });
    if (r.ok) {
      ALT = ALT.filter((b => b.host !== p.host)).concat([ {
        host: p.host,
        url: t.url
      } ]);
      saveAlt();
      return true;
    }
  } catch (e) {}
  return false;
}

async function pairBackups() {
  if (API) return;

  const box = $("alist");
  box.replaceChildren();
  const tree = JT();
  const side = sideGroups(S.agents, tree, S.cards, PR.list);
  const M = sideMachines(S.agents, homeName(), S.homeDown, API ? apiHost() : null);
  const hosts = M.hosts;
  if (M.wait) box.append(el("div", "sdown", esc(M.wait)));
  if (S.openHost == null && hosts.length && !M.down) S.openHost = hostToOpen(loadOpenHost(localStore()), hosts, S.cards);
  for (const h of hosts) {
    if (M.down && h === M.down.host) {
      box.append(el("div", "hhead down", '<span class="chev"></span><span class="hn">' + esc(h) + '</span><span class="bdgs"><span class="bdg stuck">' + tr("連不上") + "</span></span>"));
      box.append(el("div", "sdown", esc(M.down.hint)));
      continue;
    }
    const hs = hostSummary(h, S.agents, tree, S.cards, PR.list, HC.list), open = hostOpen(h, S.openHost);
    const hd = el("div", "hhead" + (open ? " open" : "") + (S.view === "machine" && MC.host === h ? " on" : ""), '<span class="chev" role="button" aria-label="' + (open ? tr("收起") : tr("展開")) + '">' + (open ? "▾" : "▸") + '</span><span class="hn">' + esc(h) + "</span>" + badgeHtml(badgeParts(hs)));
    hd.onclick = () => openMachine(h);
    const chev = hd.querySelector(".chev");
    chev.onclick = e => {
      e.stopPropagation();
      toggleOpenHost(h);
    };
    tapBadges(hd, {
      host: h
    });
    box.append(hd);
    if (!hostOpen(h, S.openHost)) continue;
    for (const a of M.agents.filter((x => x.host === h))) {
      if (a.kind === "peer_error") {
        box.append(el("div", "row", '<div class="tx"><div class="sub">' + tr("連不上：") + esc(a.error) + "</div></div>"));
        continue;

async function takeOver(e, from, a) {
  if (!(e && e.isTrusted === true) || NA.busy) return;
  const h = MC.host, k = from + "|" + a.pane;
  if (!confirm(trf("在 {h} 接手 {from} 的 {name}？會在 {h} 開一個新的 agent，從 git 的 {branch} 接著做；{from} 上沒推送的改動接不過來。", {

    name: a.name || a.pane,

  NA.busy = true;
  NA.err = "";
  renderMain(true);
  try {
    const r = await raw("/api/handoff/takeover", {
      method: "POST",

      body: JSON.stringify({
        host: h,
        from: from,
        pane: a.pane,
        note: (TK.note[k] || "").trim()

let drag = null, hold = null;

const rowsOf = h => [ ...$("alist").querySelectorAll(".row[data-ws]") ].filter((x => x.dataset.host === h));

function dropAt(y) {
  const rows = rowsOf(drag.host).filter((x => x.dataset.ws !== drag.ws));
  rows.forEach((x => x.classList.remove("drop-before", "drop-after")));
  let before = null;
  for (const x of rows) {
    const b = x.getBoundingClientRect();
    if (y < b.top + b.height / 2) {
      before = x;
      break;
    }
  }
  drag.before = before ? before.dataset.ws : null;
  if (before) before.classList.add("drop-before"); else if (rows.length) rows[rows.length - 1].classList.add("drop-after");
}

function startDrag(r, y) {
  if (!r.isConnected) r = rowsOf(r.dataset.host).find((x => x.dataset.ws === r.dataset.ws)) || r;
  drag = {
    r: r,
    host: r.dataset.host,
    ws: r.dataset.ws,
    y0: y,
    before: undefined
  };
  r.classList.add("dragging");
  if (navigator.vibrate) navigator.vibrate(10);
}

async function endDrag() {
  const d = drag;
  drag = null;
  d.r.classList.remove("dragging");
  d.r.style.transform = "";
  $("alist").querySelectorAll(".drop-before,.drop-after").forEach((x => x.classList.remove("drop-before", "drop-after")));
  const rows = rowsOf(d.host).map((x => x.dataset.ws)).filter(((w, i, a) => a.indexOf(w) === i));
  const i = rows.indexOf(d.ws);
  const unchanged = d.before === undefined || (d.before === null ? i === rows.length - 1 : rows[i + 1] === d.before);
  if (!unchanged) {
    try {
      await j("/api/workspace/move", {
        method: "POST",
        headers: H,
        body: JSON.stringify({
          host: d.host,
          workspace: d.ws,
          before: d.before
        })
      });
      toast(tr("已調整順序"));
    } catch (e) {
      toast(tr("沒有調整成功：") + (e && e.message || ""));
    }
    try {
      S.agents = await j("/api/agents");
    } catch (e) {}
  }
  renderSide();
}

$("alist").addEventListener("touchstart", (e => {
  const r = e.target.closest(".row[data-ws]");
  if (!r) return;
  const t = e.touches[0];

    x: t.clientX,
    y: t.clientY,
    timer: setTimeout((() => {

}), {

$("alist").addEventListener("touchmove", (e => {
  const t = e.touches[0];
  if (hold && (Math.abs(t.clientX - hold.x) > 8 || Math.abs(t.clientY - hold.y) > 8)) {
    clearTimeout(hold.timer);
    hold = null;
  }
  if (!drag) return;
  e.preventDefault();
  drag.r.style.transform = "translateY(" + (t.clientY - drag.y0) + "px)";
  dropAt(t.clientY);
}), {
  passive: false
});

$("alist").addEventListener("touchend", (e => {
  if (hold) {
    clearTimeout(hold.timer);
    hold = null;
  }
  if (!drag) return;
  e.preventDefault();
  endDrag();
}), {
  passive: false
});

$("alist").addEventListener("touchcancel", (() => {
  if (hold) {
    clearTimeout(hold.timer);
    hold = null;
  }
  if (drag) {
    drag.before = undefined;
    endDrag();
  }
}));

$("alist").addEventListener("dragstart", (e => {

$("alist").addEventListener("dragover", (e => {
  if (!drag) return;

  dropAt(e.clientY);
}));

$("alist").addEventListener("drop", (e => {
  if (!drag) return;
  e.preventDefault();

$("alist").addEventListener("dragend", (() => {

let bugBusy = false;

async function flushBugs() {
  if (bugBusy) return;
  bugBusy = true;
  try {
    let L = bugLoad(BUGSTORE);
    for (const b of L.slice()) {
      let ok = false;
      try {
        const [r] = await post("/api/bugs", b);
        ok = r.ok || r.status === 400;
      } catch (e) {
        break;
      }
      if (!ok) break;
      L = bugLoad(BUGSTORE).filter((x => x.id !== b.id));
      bugSave(BUGSTORE, L);
    }
  } finally {
    bugBusy = false;
    showBugSub();
  }
}

let H2C = null;

function loadH2C() {
  if (!H2C) H2C = new Promise(((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "./vendor/html2canvas.js";
    sc.onload = () => window.html2canvas ? ok(window.html2canvas) : no(new Error("html2canvas"));
    sc.onerror = () => {
      H2C = null;
      no(new Error(tr("截圖工具載入失敗")));
    };
    document.head.append(sc);
  }));
  return H2C;
}

function roundBox(g, x, y, w, h, r) {
  const L = Math.min(x, x + w), T = Math.min(y, y + h), W = Math.abs(w), H = Math.abs(h);
  r = Math.min(r, W / 2, H / 2);
  g.beginPath();
  g.moveTo(L + r, T);
  g.arcTo(L + W, T, L + W, T + H, r);
  g.arcTo(L + W, T + H, L, T + H, r);
  g.arcTo(L, T + H, L, T, r);
  g.arcTo(L, T, L + W, T, r);
  g.closePath();
  g.stroke();
}

async function shoot() {

      height: innerHeight,
      windowWidth: innerWidth,

function annotate(img) {
  const ov = el("div", "shotov"), cv = el("canvas"), bar = el("div", "shotbar");
  ov.append(cv, bar);
  document.body.append(ov);
  const g = cv.getContext("2d"), marks = [];
  let cur = null, tool = "box", size = "M";
  const red = getComputedStyle(document.documentElement).getPropertyValue("--danger-fg").trim() || "red";
  const fit = () => {
    const r = cv.getBoundingClientRect(), k = Math.min(r.width / img.width, r.height / img.height);
    return {
      k: k,
      ox: (r.width - img.width * k) / 2,
      oy: (r.height - img.height * k) / 2,
      r: r
    };
  };
  const paint = (c, m, k, ox, oy) => {
    if (m.t === "pen") {
      c.strokeStyle = "black";
      c.lineWidth = m.w * k;
      c.lineCap = "round";
      c.lineJoin = "round";
      c.beginPath();
      m.p.forEach(((q, n) => {
        const x = ox + q.x * k, y = oy + q.y * k;
        if (n) c.lineTo(x, y); else c.moveTo(x, y);
      }));
      if (m.p.length === 1) c.lineTo(ox + m.p[0].x * k + .01, oy + m.p[0].y * k);
      c.stroke();
    } else {
      c.strokeStyle = red;
      c.lineWidth = Math.max(3, img.width / 240) * k;
      roundBox(c, ox + m.x * k, oy + m.y * k, m.w * k, m.h * k, Math.max(12, img.width / 40) * k);
    }
  };
  const draw = () => {
    const d = devicePixelRatio || 1, r = cv.getBoundingClientRect();
    cv.width = r.width * d;
    cv.height = r.height * d;
    g.setTransform(d, 0, 0, d, 0, 0);
    const f = fit();
    g.clearRect(0, 0, r.width, r.height);
    g.drawImage(img, f.ox, f.oy, img.width * f.k, img.height * f.k);
    for (const m of marks.concat(cur ? [ cur ] : [])) paint(g, m, f.k, f.ox, f.oy);
  };
  const at = e => {
    const f = fit();
    return {
      x: (e.clientX - f.r.left - f.ox) / f.k,
      y: (e.clientY - f.r.top - f.oy) / f.k
    };
  };
  cv.onpointerdown = e => {
    cv.setPointerCapture(e.pointerId);
    const p = at(e);
    cur = tool === "pen" ? {
      t: "pen",
      w: penWidth(size, img.width),
      p: [ p ]
    } : {
      t: "box",
      x: p.x,
      y: p.y,
      w: 0,
      h: 0
    };
    draw();
  };
  cv.onpointermove = e => {
    if (!cur) return;
    const p = at(e);
    if (cur.t === "pen") cur.p.push(p); else {
      cur.w = p.x - cur.x;
      cur.h = p.y - cur.y;
    }
    draw();
  };
  cv.onpointerup = () => {
    if (cur && (cur.t === "pen" || Math.abs(cur.w) > 8 && Math.abs(cur.h) > 8)) marks.push(cur);
    cur = null;
    draw();
  };
  const btn2 = (t, c, f) => {
    const x = el("button", c, esc(t));
    x.onclick = f;
    return x;
  };
  const tools = el("div", "shottools"), sizes = el("div", "shottools");
  const paintBar = () => {
    tools.replaceChildren(btn2(tr("框"), tool === "box" ? "on" : "", (() => {
      tool = "box";
      paintBar();
    })), btn2(tr("黑筆"), tool === "pen" ? "on" : "", (() => {
      tool = "pen";
      paintBar();
    })));
    sizes.replaceChildren(...[ [ "S", tr("細") ], [ "M", tr("中") ], [ "L", tr("粗") ] ].map((([k, l]) => btn2(l, size === k ? "on" : "", (() => {
      size = k;
      paintBar();
    })))));
    sizes.hidden = tool !== "pen";
  };
  paintBar();
  bar.append(el("div", "hint", tr("「框」圈出有問題的地方，「黑筆」塗掉不想給人看的內容，再按「下一步」寫一句話。")), tools, sizes, btn2(tr("復原"), "", (() => {
    marks.pop();
    draw();
  })), btn2(tr("取消"), "", (() => {
    ov.remove();
    window.removeEventListener("resize", draw);
  })), btn2(tr("下一步"), "allow", (() => {
    const out = document.createElement("canvas");
    out.width = img.width;
    out.height = img.height;
    const o = out.getContext("2d");
    o.drawImage(img, 0, 0);
    for (const m of marks) paint(o, m, 1, 0, 0);
    out.toBlob((bl => {
      ov.remove();
      window.removeEventListener("resize", draw);
      if (bl) openBug(bl); else toast(tr("截圖失敗："));
    }), "image/jpeg", .9);
  })));
  addEventListener("resize", draw);
  requestAnimationFrame(draw);
}

async function post(path, body) {
  const r = await raw(path, {
    method: "POST",
    headers: H,
    body: JSON.stringify(body)
  });
  if (r.status === 401) {
    if (!API) {
      location.reload();
      throw 0;
    }
    throw new Error(notPairedMsg(apiHost()));
  }
  let j = {};
  try {
    j = await r.json();
  } catch (e) {}
  return [ r, j ];
}

function after(c, nc, note) {
  const i = S.cards.findIndex((x => sameCard(x, c)));
  if (i >= 0) {
    if (nc) S.cards[i] = nc; else S.cards.splice(i, 1);
  }

  renderSide();

    P.card = nc;
    P.typing = false;
    P.note = note || (picked ? trf("✓ 已送出「{x}」。畫面到了下一步，請看下面。", {
      x: picked

function screenDo(path, payload) {
  const c = P.card;
  return act((async () => {
    const [r, j] = await post(path, Object.assign({
      host: c.host,
      id: c.id
    }, payload));
    if (r.ok) return after(c, j.card || null);
    if (r.status === 409) return after(c, j.card || null, tr("畫面剛好變了，這次沒有送出。看一下目前的畫面再點一次。"));
    if (r.status === 410) {
      after(c, null, tr("這個問題已經不在了"));
      return;
    }
    throw new Error(j.error || r.status);
  }));
}

function copyText(t, b) {
  const done = () => {
    b.textContent = tr("已複製");
    setTimeout((() => b.textContent = tr("複製")), 1200);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(t).then(done);
    return;
  }
  const x = document.createElement("textarea");
  x.value = t;
  x.setAttribute("readonly", "");
  x.style.position = "fixed";
  x.style.opacity = "0";
  document.body.append(x);
  x.select();
  x.setSelectionRange(0, t.length);
  try {
    document.execCommand("copy");
    done();
  } catch (e) {}
  x.remove();
}

async function openFile(p, kind, name, size) {
  const a = F.agent;
  F.file = {
    path: p,
    kind: kind,
    name: name,
    size: size
  };
  F.body = null;
  F.err = "";

  renderMain(true);
  try {
    const r = await raw("/api/files/raw?" + fq(a, p));
    if (r.status === 401) throw new Error(tr("沒有配對"));
    if (!r.ok) throw new Error(await r.text() || r.status);
    if (!F.file || F.file.path !== p || a !== F.agent) return;
    if (kind === "text" || kind === "md" || kind === "html") {
      const tx = await r.text();
      const pg = kind === "html" ? await inlineHtml(tx, a, p) : null;
      if (!F.file || F.file.path !== p || a !== F.agent) return;
      F.page = pg;
      F.body = tx;
    } else {
      if (F.url) URL.revokeObjectURL(F.url);
      const bl = await r.blob();
      F.blob = bl;
      F.url = URL.createObjectURL(bl);
      F.body = F.url;
    }
  } catch (e) {
    if (F.file && F.file.path === p) F.err = e && e.message || tr("讀不到");
  }
  if (S.tab === "files") renderMain(true);
}

const MDU = [];

function hydrateMd(node, a, base) {
  let n = 0;
  for (const im of node.querySelectorAll("img.mdimg")) {
    const p = relPath(base, im.dataset.src);
    const miss = () => {
      const s = el("span", "mdmiss");
      s.textContent = "🖼 " + (im.alt || im.dataset.src) + tr("（讀不到）");
      im.replaceWith(s);
    };
    if (!p || ++n > 24) {
      miss();
      continue;
    }
    raw("/api/files/raw?" + fq(a, p)).then((async r => {
      if (!r.ok) return miss();
      const u = URL.createObjectURL(await r.blob());
      MDU.push(u);
      im.src = u;
    })).catch(miss);
  }
  for (const l of node.querySelectorAll("a.mdfile")) {
    const p = relPath(base, l.dataset.file);
    if (!p) {
      l.removeAttribute("class");
      continue;
    }
    l.href = "#";
    l.onclick = e => {
      e.preventDefault();
      if (S.tab !== "files") return;
      const nm = p.split("/").pop();
      openFile(p, kindGuess(nm), nm, 0);
    };
  }
  return node;
}

  fr.onerror = no;

}));

async function inlineHtml(body, a, base) {
  try {
    const doc = (new DOMParser).parseFromString(body, "text/html");
    let n = 0;
    const jobs = [];
    for (const im of doc.querySelectorAll("img[src]")) {
      const p = relPath(base, im.getAttribute("src"));
      if (!p || ++n > 24) continue;
      jobs.push(raw("/api/files/raw?" + fq(a, p)).then((async r => {
        if (r.ok) im.setAttribute("src", await blobData(await r.blob()));
      })).catch((() => {})));
    }
    for (const lk of doc.querySelectorAll('link[rel~="stylesheet"][href]')) {
      const p = relPath(base, lk.getAttribute("href"));
      if (!p || ++n > 24) continue;
      jobs.push(raw("/api/files/raw?" + fq(a, p)).then((async r => {
        if (r.ok) {
          const st = doc.createElement("style");
          st.textContent = await r.text();
          lk.replaceWith(st);
        }
      })).catch((() => {})));
    }
    if (!jobs.length) return body;
    await Promise.all(jobs);
    return (/^\s*<!doctype/i.test(body) ? "<!doctype html>" : "") + doc.documentElement.outerHTML;
  } catch (e) {
    return body;
  }
}

function frow(icon, name, sub, off, fn) {
  const r = el("div", "frow" + (off ? " off" : ""), '<span class="ic">' + icon + '</span><span class="fn"><bdi>' + esc(name) + '</bdi></span><span class="fs">' + esc(sub || "") + "</span>");
  if (!off) r.onclick = fn;
  return r;
}

async function uploadPhotos(h, inp) {
  const fs = [ ...inp.files ];
  inp.value = "";
  if (!fs.length) return;
  const got = await takePhotos(fs);
  let n = 0;
  try {
    for (const x of got) {
      toast(trf("上傳照片 {i}/{n}…", {
        i: ++n,
        n: got.length
      }));
      await uploadTo(h, x.blob, x.name);
      URL.revokeObjectURL(x.url);
    }

      h: h
    }));
  } catch (e) {
    alert(tr("照片沒有傳上去：") + (e && e.message || ""));

  const a = S.cur, f = canvasFile();
  if (!a || !f) return;

  const k = f.path + "|" + x.version;

  CV.bkey = k;
  CV.body = null;
  CV.berr = "";
  try {
    const r = await raw("/api/canvas/raw?host=" + encodeURIComponent(a.host) + "&pane=" + encodeURIComponent(a.pane_id) + "&path=" + encodeURIComponent(f.path) + (x.rev ? "&rev=" + x.rev : ""));
    if (r.status === 401) throw new Error(tr("沒有配對"));

const PDFS = {
  lib: null,
  docs: new WeakMap,
  page: {}
};

function loadPdfjs() {
  if (!PDFS.lib) PDFS.lib = import("./vendor/pdf.min.mjs").then((m => {
    m.GlobalWorkerOptions.workerSrc = "./vendor/pdf.worker.min.mjs";
    return m;
  })).catch((e => {
    PDFS.lib = null;
    throw e;
  }));
  return PDFS.lib;
}

async function pdfDoc(blob) {
  let d = PDFS.docs.get(blob);
  if (!d) {
    d = loadPdfjs().then((async m => m.getDocument({
      data: new Uint8Array(await blob.arrayBuffer()),
      isEvalSupported: false
    }).promise));
    PDFS.docs.set(blob, d);
  }
  return d;
}

function pdfView(blob, key) {
  const w = el("div", "pdfv"), pg = el("div", "pg"), cv = el("canvas"), bar = el("div", "pdfbar");
  pg.append(cv);
  w.append(bar, pg);
  const prev = el("button", "", esc(tr("‹ 上一頁"))), next = el("button", "", esc(tr("下一頁 ›"))), at = el("span", "pn", esc(tr("讀取中…")));
  bar.append(prev, at, next);
  if (!blob) {
    at.textContent = tr("讀不到");
    return w;
  }
  let doc = null, busy = false;
  const show = async () => {
    if (!doc || busy) return;
    busy = true;
    const n = Math.min(Math.max(1, PDFS.page[key] || 1), doc.numPages);
    PDFS.page[key] = n;
    try {
      const p = await doc.getPage(n);
      const box = pg.getBoundingClientRect(), v1 = p.getViewport({
        scale: 1
      });
      const k = Math.max(.1, Math.min((box.width || 320) / v1.width, (box.height || 480) / v1.height));
      const d = devicePixelRatio || 1, vp = p.getViewport({
        scale: k * d
      });
      cv.width = vp.width;
      cv.height = vp.height;
      cv.style.width = Math.round(vp.width / d) + "px";
      cv.style.height = Math.round(vp.height / d) + "px";
      await p.render({
        canvasContext: cv.getContext("2d"),
        viewport: vp
      }).promise;
    } catch (e) {
      at.textContent = tr("這一頁畫不出來");
    } finally {
      busy = false;
    }
    at.textContent = trf("{n} / {t} 頁", {
      n: n,
      t: doc.numPages
    });
    prev.disabled = n <= 1;
    next.disabled = n >= doc.numPages;
  };
  const go = dn => {
    if (!doc) return;
    PDFS.page[key] = (PDFS.page[key] || 1) + dn;
    show();
  };
  prev.onclick = () => go(-1);
  next.onclick = () => go(1);
  let sx = null;
  pg.addEventListener("pointerdown", (e => {
    sx = e.clientX;
  }));
  pg.addEventListener("pointerup", (e => {
    if (sx !== null && Math.abs(e.clientX - sx) > 50) go(e.clientX < sx ? 1 : -1);
    sx = null;
  }));
  pdfDoc(blob).then((d => {
    doc = d;
    requestAnimationFrame(show);
  })).catch((e => {
    at.textContent = tr("PDF 打不開：") + (e && e.message || "");
  }));
  return w;
}

const SHPROG = [ [ N_("已分派"), "as", "→" ], [ N_("處理中"), "wip", "⋯" ], [ N_("完成"), "ok", "✓" ], [ N_("不處理"), "no", "—" ] ];

const shProgOf = y => SHPROG.find((p => p[0] === y.progress)) || [ y.progress, "", "" ];

function shProgText(y) {
  const p = shProgOf(y);
  return (p[2] ? p[2] + " " : "") + (y.assigned_to && p[1] !== "no" ? y.assigned_to + " · " : "") + tr(y.progress);
}

function shProgEl(y, full) {
  const p = shProgOf(y).slice(1);
  const t = shProgText(y) + (full && y.progress_note ? "：" + y.progress_note : "") + (full && y.progress_at ? " · " + shWhen(y.progress_at) : "");
  return el(full ? "div" : "span", "sprog" + (p[0] ? " " + p[0] : "") + (full ? " full" : ""), esc(t));
}

    };
    h.append(b, el("span", "crumb", esc(s.id + ".md · " + s.host)));

    const top = el("div", "sh");
    top.append(tldrEl(s.tldr, []));
    top.append(el("div", "tt", esc(s.title || s.id)));
    top.append(el("div", "hint", esc(specLabel(s) + (s.approved_ts ? " · " + shWhen(s.approved_ts) : ""))));
    if (specCanApprove(s)) top.append(el("div", "hint", tr("整份讀完後，按最下面的「核准」。核准的是這份內容（sha256 如下），之後只要改過一個字就要重新核准。")));
    log.append(top);
    const v = el("div", "sbody spectext");
    v.textContent = s.text != null ? s.text : s.error || "";
    log.append(v);
    const f = el("div", "sh");
    f.append(el("div", "u", esc("sha256 " + (s.sha256 || "—"))));
    if (SP.note) f.append(el("div", "pnote", esc(SP.note)));
    if (specCanApprove(s)) {
      const a = el("button", "lasting", tr("核准"));
      a.disabled = SP.busy;
      a.onclick = e => approveSpec(e, s);
      f.append(a, el("div", "lnote", esc(tr(LASTING_NOTE))));
    }
    log.append(f);
    versionedBox(log, specJob(s), s.owner || null, s.sha256, specCanApprove(s) && !specRejected(s, JT().comments));
    return;
  }
  SP.cur = null;
  $("title").textContent = tr("全部 spec");
  $("subtitle").textContent = L ? trf("{n} 份等你核准", {
    n: specsWaiting(L)
  }) : "";
  log.append(backTo(tr("← PRD 簽核"), (() => openPrds())));
  if (SP.err) log.append(el("div", "hint", esc(SP.err)));
  if (!L) {
    if (!SP.err) log.append(el("div", "typing", tr("讀取中…")));
    return;
  }
  if (!L.length) {
    log.append(el("div", "", '<div id="empty">' + tr("沒有 spec。") + "</div>"));
    return;
  }
  const PJ = specProjects(L);
  if (PJ.length > 1) {
    const fc = el("div", "fchips");
    for (const [k, lab] of [ [ "", trf("全部（{n}）", {
      n: L.length
    }) ], ...PJ.map((p => [ p.key, p.label + trf("（{x}）", {
      x: p.n + (p.waiting ? trf("，{n} 等你", {
        n: p.waiting
      }) : "")
    }) ])) ]) {
      const b = el("button", SP.filter === k ? "on" : "", esc(lab));
      b.onclick = () => {
        SP.filter = k;
        renderMain(true);
      };
      fc.append(b);
    }
    log.append(fc);
  }
  for (const x of specOrder(specFiltered(L, SP.filter))) log.append(frow(specCanApprove(x) ? "📝" : x.state === "approved" ? "✅" : "📄", x.title || x.id, x.host + " · " + (x.project ? x.project + " · " : "") + x.id + " · " + specLabel(x), false, (() => openSpec(x))));
}

async function approveSpec(e, s) {
  if (SP.busy) return;
  if (!specTapOk(e, SP.shownAt, Date.now(), TAPDOWN)) {
    if (e && e.isTrusted) toast(tr("先把 spec 讀完，再按一次"));
    return;
  }
  SP.busy = true;
  SP.note = tr("送出中…");
  renderMain(true);
  try {
    const [r, b] = await post("/api/specs/approve", {
      host: s.host,
      project: s.project,
      id: s.id,
      shown: s.sha256
    });
    if (r.ok) {
      SP.note = "";
      toast(trf("已核准 {id}", {
        id: s.id
      }));
    } else if (r.status === 409) {
      SP.note = tr("這份 spec 在你看的時候改過了，沒有核准。下面已換成最新內容，讀完再按一次。");
    } else SP.note = tr("沒有核准：") + (b.error || r.status);
  } catch (er) {
    SP.note = tr("沒有核准：") + (er && er.message || tr("連不上"));
  } finally {
    SP.busy = false;
    SP.lsig = "";
    await loadSpecs();
    renderMain(true);
  }
}

  loadSpecs();
}

async function decideHarness(e, c, decision) {
  if (HC.busy) return;
  if (!specTapOk(e, HC.shownAt, Date.now(), TAPDOWN)) {
    if (e && e.isTrusted) toast(tr("先把卡片讀完，再按一次"));
    return;
  }
  HC.busy = true;
  HC.note = tr("送出中…");
  renderMain(true);
  try {
    const [r, b] = await post("/api/harness/decide", {
      id: c.id,
      shown: c.sha256,
      decision: decision
    });
    if (r.ok) {
      HC.note = "";
      toast(decision === "approve" ? tr("已核准，下次同步會送到 gpu-box") : tr("已退回"));
    } else if (r.status === 409) {
      HC.note = tr("這張卡在你看的時候改過了，或已經決定過；下面是最新內容。");
    } else HC.note = tr("沒有送出：") + (b.error || r.status);
  } catch (er) {
    HC.note = tr("沒有送出：") + (er && er.message || tr("連不上"));
  } finally {
    HC.busy = false;
    HC.lsig = "";
    await loadHarness();
    renderMain(true);
  }
}

async function rejectWith(e, x, owner, version) {
  if (!(e && e.isTrusted === true) || JB.busy) return;
  const t = JB.draft;
  if (!t.trim()) {
    toast(tr("先寫退回的原因，再按「附意見退回」"));
    return;
  }
  JB.busy = true;
  let c = null;
  try {
    const [r, b] = await post("/api/jobs/comment", {
      host: x.host,
      job: x.id,
      text: t,
      version: version,
      verdict: "reject"
    });
    if (r.ok) {
      c = b;
      JB.draft = "";
    } else toast(r.status === 409 ? tr("它在你看的時候改過了，沒有退回；讀新的版本再決定") : tr("沒有退回：") + (b.error || r.status));
  } catch (er) {
    toast(tr("沒有退回：") + (er && er.message || tr("連不上")));
  } finally {
    JB.busy = false;
  }
  if (!c) {
    await loadJobs();
    renderMain(true);
    return;
  }
  const a = jobHandoffTargets(x, S.agents, owner).find((q => agentHq(q) === owner));
  if (a) await handoffComment(e, x, c, a); else {
    toast(tr("已退回；寫的人不在線上，之後按「交給」"));
    await loadJobs();
    renderMain(true);
  }
}

function showAgentJobs() {
  const a = S.cur, log = $("log");
  log.replaceChildren();
  $("composer").hidden = true;
  $("title").textContent = a.name || a.cwd_name || a.pane_id;
  $("subtitle").textContent = a.host + tr(" · 排程");
  const t = JT();
  const mine = t.byOwner[agentHq(a)] || [];
  if (JB.err) log.append(el("div", "hint", esc(JB.err)));
  if (!JB.list) {
    if (!JB.err) log.append(el("div", "typing", tr("讀取中…")));
    return;
  }
  const x = JB.proj ? mine.find((q => q.key === JB.proj)) : null;
  if (x) return projDetail(log, x, tr("這個 agent 的專案"), (() => {
    JB.proj = null;
    JB.job = null;
    renderMain(true);
  }));
  const jobs = jobsOfAgent(t, a), jb = JB.job ? jobs.find((q => jobKey(q) === JB.job)) : null;
  if (jb) return jobDetail(log, jb, agentHq(a), tr("排程"));
  okrCard(log, a);
  for (const c of cardsFor(a)) log.append(cardEl(c));
  reqNew(log, a);
  const shown = agentHq(a) === DEFAULT_OWNER ? jobs : jobs.filter((j => !j.unclaimed));
  const C = schedCards(QU.off ? [] : QU.list, a, shown, Date.now());
  if (!C.length) log.append(el("div", "hint", tr("現在沒有要求，也沒有工作。在上面寫一則，它接手、做完，這裡都看得到。")));
  for (const c of C) log.append(schedRowEl(c, a, shown));
  const bs = bonStatsLine(bonStats(shown));
  if (bs) log.append(el("div", "hint", esc(bs)));
  log.append(el("div", "hq", esc(hqLine(hqSummary(mine)))));
  const grp = sideGroups(S.agents, t, S.cards, PR.list).groups.find((g => g.hq === agentHq(a)));
  if (grp && grp.workers.length) {
    log.append(el("div", "fsec", esc(trf("底下的 agent（{n}）", {
      n: grp.workers.length
    }))));

async function askAct(e, a, act) {
  if (!(e && e.isTrusted === true) || UA.busy) return;
  const text = String(UA.draft[a.id] || "").trim();
  if (act === "reply" && !text) return;
  if (act === "drop" && !confirm(trf("不做了？\n{t}\n\n會告訴 {hq}，請它停掉只為這件事做的工作。", {
    t: a.title,
    hq: a.hq
  }))) return;
  UA.busy = true;
  try {
    const [r, b] = await post("/api/asks/act", {
      host: a.host,
      id: a.id,
      act: act,
      text: text
    });
    if (r.ok) {
      UA.draft[a.id] = "";
      UA.open = "";
      toast(b.told ? trf("已告訴 {hq}", {
        hq: a.hq
      }) : trf("記下了；{hq} 現在沒有在跑，它下次開工會看到", {
        hq: a.hq
      }));
    } else toast(tr("沒有送出：") + (b.error || r.status));
  } catch (er) {
    toast(tr("沒有送出：") + (er && er.message || tr("連不上")));
  } finally {
    UA.busy = false;
    UA.lsig = "";
    await loadAsks();
    renderMain(true);
  }
}

async function paraComment(x, p, q) {
  const t = PD.pdraft;
  if (!t.trim() || JB.busy) return;
  JB.busy = true;
  try {
    const [r, b] = await post("/api/jobs/comment", {
      host: x.host,
      job: x.id,
      text: t,
      version: p.sha256,
      para: {
        i: q.i,
        sha: q.sha
      }
    });
    if (r.ok) {
      PD.pdraft = "";
      PD.para = null;

    await loadPrds();
    renderMain(true);

}

let hashDone = false;

const HASH_OPEN = {};

function applyHash() {
  if (hashDone) return;
  const h = parseHash(location.hash);
  if (!Object.keys(h).length) {
    hashDone = true;
    return;
  }
  if (h.open === "compact") HASH_OPEN.compact = true;
  if (h.host && S.agents.some((x => x.host === h.host))) setOpenHost(h.host);
  if (h.card) {
    const c = S.cards[0];
    if (!c) return;
    hashDone = true;
    openPanel(c);
    return;
  }
  if (h.shot) {
    hashDone = true;
    setTimeout(shoot, 1200);
    return;
  }
  if (h.view === "confirm") {
    hashDone = true;
    openConfirm([ "history", "alerts", "asks" ].includes(h.tab) ? h.tab : "pending");
    return;
  }
  if (h.view === "hosts" || h.view === "settings") {
    hashDone = true;
    openSettings();
    if (h.side) openSide(true);
    return;
  }
  if (h.view === "explorer") {
    const a = S.cur || S.agents.find((x => x.kind !== "peer_error" && x.pane_id));
    if (!a) return;
    hashDone = true;
    pick(a);
    setTab("files");
    if (h.side) openSide(true);
    return;
  }
  if (h.prd) {
    const p = (PR.list || []).find((x => prdKey(x) === h.prd));
    if (!p) {
      loadPrds();
      return;
    }
    hashDone = true;
    openPrd(p, "prds");
    return;
  }
  if (h.view === "prds") {
    hashDone = true;
    openConfirm(h.tab === "history" ? "history" : "pending");
    return;
  }
  if (h.machine) {
    if (!S.agents.some((x => x.host === h.machine))) return;
    hashDone = true;
    MC.tab = [ "usage", "gpu" ].includes(h.tab) ? h.tab : "res";
    openMachine(h.machine);
    if (h.side) openSide(true);
    return;
  }
  if (h.view === "loose") {
    const a = S.agents.find((x => x.kind !== "peer_error" && agentHq(x) === DEFAULT_OWNER));
    if (!a) return;
    hashDone = true;
    pick(a);
    setTab("jobs");
    return;
  }
  if (h.badges) {
    const i = h.badges.indexOf(":"), k = h.badges.slice(0, i), v = h.badges.slice(i + 1);
    const a = k === "agent" ? S.agents.find((x => key(x) === v)) : null;
    if (k === "host" ? !S.agents.some((x => x.host === v)) : !a) return;
    hashDone = true;
    showBadgeList(a ? {
      agent: a
    } : {
      host: v
    });
    return;
  }
  if (h.agent) {
    const a = S.agents.find((x => key(x) === h.agent)) || S.agents.find((x => (x.name || x.cwd_name) === h.agent && (!h.host || x.host === h.host)));
    if (!a) return;
    hashDone = true;
    pick(a);
    if (h.tab) setTab(hashTab(h.tab));
    if (h.file) CV.file = h.file;
    if (h.open) {
      const n = h.open.split("/").pop();
      const k = /\.pdf$/i.test(n) ? "pdf" : /\.(mp4|m4v|mov|webm)$/i.test(n) ? "video" : /\.(md|markdown)$/i.test(n) ? "md" : /\.(png|jpe?g|gif|webp|svg)$/i.test(n) ? "image" : "text";
      setTimeout((() => openFile(h.open, k, n, 0)), 300);
    }
    if (h.project) {
      JB.proj = h.project;
      renderMain(true);
    }
  } else hashDone = true;
  if (h.side) openSide(true);
}

function syncPanel() {
  if (!P.card || P.busy) return;
  const f = S.cards.find((x => sameCard(x, P.card)));
  if (!f) {

    return;

  if (f.kind === "login") {

      P.card = f;
      if (f.step === "code") P.note = "";
      renderPanel();
    }
    return;
  }
  if (f.text_fp !== P.card.text_fp || f.preview !== P.card.preview || f.reason !== P.card.reason) {

  }

async function poll() {
  S.tick++;
  if (S.tick % (S.view === "confirm" ? 3 : 10) === 2) loadAsks();
  if (S.tick % (S.view === "confirm" ? 5 : 15) === 4) loadAlerts();
  if (S.view === "machine" && (MC.tab === "res" || S.tick % 15 === 1 || usagePartial())) loadMachine();
  if (S.tick % 5 === 1 || S.view === "chat" && S.tab === "jobs" && S.tick % 2 === 1) loadQueue();
  if (S.view === "settings" && S.tick % 15 === 1) loadQuota();
  if (S.view === "shares" || S.tick % 15 === 1) loadShares();
  if (S.view === "specs" || S.view === "prds" || S.tick % 15 === 1) loadSpecs();
  if (S.view === "harness" || S.view === "prds" || S.tick % 15 === 1) loadHarness();
  if (jobsOpen() || S.view === "prd" || S.view === "specs" ? S.tick % 2 === 1 : S.tick % 15 === 1) loadJobs();
  if (S.view === "prd" || S.view === "prds" || S.view === "confirm" || S.view === "chat" && S.tab === "jobs" ? S.tick % 3 === 1 : S.tick % 15 === 1) loadPrds();
  if (S.view === "prds" && S.tick % 5 === 1) loadDecisions();
  if (S.view === "confirm" && S.tick % 5 === 1) loadDecisions();
  try {
    S.cards = (await j("/api/pending")).filter((x => x.kind !== "peer_error"));
    syncPanel();
  } catch (e) {}
  if (S.tick % 3 === 1 || !S.agents.length) {
    try {
      S.agents = await j("/api/agents");
      const k = S.cur ? key(S.cur) : load();
      const f = S.agents.find((a => key(a) === k));
      if (f) {
        if (!S.cur) {
          S.cur = f;
          if (!$("msg").value) showDraft(f);
          loadChat();
        } else S.cur.status = f.status;
      }
    } catch (e) {}
  }
  applyHash();
  renderSide();
  if (BG.spec && !P.card) showBadges();
  if (S.view === "confirm") {
    if (confirmSig() !== CF.sig) renderMain(true);
  } else if (S.cur) {
    await loadChat();
    if (S.tab === "files") {
      if (Date.now() - CV.at > 1e4) loadCanvas();
      if (!F.file && Date.now() - F.at > 1e4) loadFiles();
    }
  }
}

async function shrink(f) {
  try {
    const b = await createImageBitmap(f);
    const k = Math.min(1, 2048 / Math.max(b.width, b.height));
    const c = document.createElement("canvas");
    c.width = Math.round(b.width * k);
    c.height = Math.round(b.height * k);
    c.getContext("2d").drawImage(b, 0, 0, c.width, c.height);
    if (b.close) b.close();
    const o = await new Promise((r => c.toBlob(r, "image/jpeg", .85)));
    return o || f;
  } catch (e) {
    return f;
  }
}

async function takePhotos(list) {
  const out = [];
  for (const f of [ ...list ].slice(0, 10)) {
    const b = await shrink(f);
    const base = (f.name || "photo").replace(/\.[^.]+$/, "");
    out.push({
      blob: b,
      name: b === f ? f.name || "photo" : base + ".jpg",
      url: URL.createObjectURL(b)
    });
  }
  return out;
}

async function upload(blob, name, a) {
  const q = "name=" + encodeURIComponent(name) + (a ? "&host=" + encodeURIComponent(a.host) + "&pane=" + encodeURIComponent(a.pane_id) : "");
  const r = await raw("/api/uploads?" + q, {
    method: "POST",
    headers: {
      "x-aide-approve": "1",
      "content-type": "application/octet-stream"
    },
    body: blob,
    waitMs: 6e4
  });
  if (r.status === 401) throw new Error(tr("沒有配對"));
  if (!r.ok) throw new Error(await r.text() || r.status);
  return r.json();
}

async function uploadTo(host, blob, name) {

async function send() {
  const a = S.cur;
  const typed = ta.value;
  const atts = S.atts.slice();
  if (!typed.trim() && !atts.length || !a || S.sending) return;
  S.sending = true;
  $("send").disabled = true;
  $("plus").disabled = true;
  try {
    const paths = [];
    for (const x of atts) {
      toast(trf("上傳照片 {i}/{n}…", {
        i: paths.length + 1,
        n: atts.length
      }));
      paths.push((await upload(x.blob, x.name, a)).path);
    }
    let t = typed;
    if (S.reply) {
      const q = S.reply.trim().split("\n").slice(0, 12).map((l => "> " + l.slice(0, 300))).join("\n");
      t = "（回覆你先前這段）\n" + q + "\n\n" + t;
      S.reply = null;
      $("quote").classList.remove("on");
    }
    if (paths.length) t = (t.trim() ? t + "\n\n" : "") + photoLines(paths);
    if (atts.length) dropAtts();
    ta.value = "";
    sizeTa();
    keepDraft();
    const oid = "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    OUT = outAdd(OUT, key(a), t, Date.now(), oid);
    outSave(BUGSTORE, OUT);
    renderMain();
    $("log").scrollTop = $("log").scrollHeight;
    try {
      await postSend(a, t);
      OUT = outMark(OUT, oid, "sent");
      outSave(BUGSTORE, OUT);
      a.status = "working";
      setTimeout(loadChat, 700);
    } catch (e) {
      OUT = outDrop(OUT, oid);
      outSave(BUGSTORE, OUT);
      ta.value = typed;
      keepDraft();
      if (e) alert(tr("沒有送出：") + e.message + (paths.length ? tr("（照片已在書籤）") : ""));
      renderMain();
    }
  } catch (e) {
    if (e) alert(tr("照片沒有傳上去：") + e.message);
  } finally {
    S.sending = false;
    const w = !!(S.cur && cardsFor(S.cur).length);
    $("send").disabled = w;
    $("plus").disabled = w;
  }
}

async function enablePush() {
  try {
    if (!window.isSecureContext || !("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert(tr("要用 https 網址打開，iPhone 還要先加入主畫面、從主畫面打開"));
      return;
    }
    const reg = await navigator.serviceWorker.register("/sw.js");
    await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      if (await Notification.requestPermission() !== "granted") {
        alert(tr("通知權限沒開"));
        return;
      }
      const k = await j("/api/push/key");
